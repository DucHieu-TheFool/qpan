    <style>
        /* =====================================================================
           DESIGN TOKENS: DARK TACTICAL COMMAND THEME (#04070D -> #0B1322)
           ===================================================================== */
        :root {
            --bg-base: radial-gradient(circle at 50% 22%, #0B1322 0%, #060B15 58%, #04070D 100%);
            --tactical-grid: rgba(56, 189, 248, 0.048);
            --tactical-ring: rgba(234, 179, 8, 0.055);
            --frame-gold: rgba(234, 179, 8, 0.45);
            --frame-radar: rgba(56, 189, 248, 0.36);

            /* Top Horizontal Lead Box */
            --lead-bg: linear-gradient(135deg, rgba(11, 19, 34, 0.95) 0%, rgba(15, 24, 42, 0.93) 100%);
            --lead-border: rgba(234, 179, 8, 0.5);

            /* Card 01 (Left): Tactical Radar Cyan */
            --card1-bg: linear-gradient(165deg, rgba(11, 19, 34, 0.94) 0%, rgba(8, 15, 28, 0.96) 100%);
            --card1-border: rgba(56, 189, 248, 0.44);

            /* Card 02 (Right): Tactical Command Gold */
            --card2-bg: linear-gradient(165deg, rgba(15, 24, 42, 0.95) 0%, rgba(9, 16, 30, 0.97) 100%);
            --card2-border: rgba(234, 179, 8, 0.48);

            --bar-bg: rgba(4, 7, 13, 0.95);
            --glass-ui: rgba(11, 19, 34, 0.92);
            --shadow-elevated: 0 14px 34px -8px rgba(0, 0, 0, 0.78);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            background: var(--bg-base);
            background-color: #04070D;
            color: #F1F5F9;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "Be Vietnam Pro", sans-serif;
        }

        /* Tactical Coordinate Grid & Radar Rings Overlay */
        .topo-overlay {
            background-image:
                linear-gradient(to right, var(--tactical-grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--tactical-grid) 1px, transparent 1px),
                radial-gradient(circle at 50% 46%, transparent 20%, var(--tactical-ring) 20.5%, transparent 21%),
                radial-gradient(circle at 50% 46%, transparent 36%, var(--tactical-ring) 36.5%, transparent 37%);
            background-size: 64px 64px, 64px 64px, 100% 100%, 100% 100%;
        }

        /* =====================================================================
           FIXED 100VH SHELL: HEADER 60PX + VIEWPORT CALC(100VH - 120PX) + FOOTER 60PX
           ===================================================================== */
        #slide-viewport {
            height: calc(100vh - 120px);
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 36px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* Gold-Trimmed Tactical Scrollbar */
        #slide-viewport::-webkit-scrollbar,
        .custom-scroll::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        #slide-viewport::-webkit-scrollbar-track,
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(11, 19, 34, 0.7);
            border-radius: 999px;
        }

        #slide-viewport::-webkit-scrollbar-thumb,
        .custom-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #EAB308, #38BDF8);
            border-radius: 999px;
        }

        #slide-viewport::-webkit-scrollbar-thumb:hover {
            background: #FACC15;
        }

        /* =====================================================================
           OUTER COMMAND FRAME & 4 CORNER RETICLES
           ===================================================================== */
        .outer-command-frame {
            position: fixed;
            inset: 6px;
            border: 1px solid var(--frame-gold);
            pointer-events: none;
            z-index: 30;
            border-radius: 10px;
        }

        .outer-command-frame::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid var(--frame-radar);
            opacity: 0.45;
            border-radius: 7px;
        }

        .screen-corner {
            position: fixed;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 31;
        }

        .screen-corner-tl {
            top: 6px;
            left: 6px;
            border-top: 3px solid #EAB308;
            border-left: 3px solid #EAB308;
            border-top-left-radius: 10px;
        }

        .screen-corner-tr {
            top: 6px;
            right: 6px;
            border-top: 3px solid #EAB308;
            border-right: 3px solid #EAB308;
            border-top-right-radius: 10px;
        }

        .screen-corner-bl {
            bottom: 6px;
            left: 6px;
            border-bottom: 3px solid #38BDF8;
            border-left: 3px solid #38BDF8;
            border-bottom-left-radius: 10px;
        }

        .screen-corner-br {
            bottom: 6px;
            right: 6px;
            border-bottom: 3px solid #38BDF8;
            border-right: 3px solid #38BDF8;
            border-bottom-right-radius: 10px;
        }

        /* =====================================================================
           CENTRAL ROTATING RADAR AZIMUTH GRID (120S)
           ===================================================================== */
        @keyframes spinRadarAzimuth {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .radar-wheel-spin {
            animation: spinRadarAzimuth 120s linear infinite;
            transform-origin: center center;
        }

        /* =====================================================================
           TACTICAL GLASS BARS & SURFACES
           ===================================================================== */
        .tactical-bar {
            background: var(--bar-bg);
            backdrop-filter: blur(12px);
        }

        .ui-pill {
            background: var(--glass-ui);
            border: 1px solid rgba(234, 179, 8, 0.36);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }

        .lead-box-surface {
            background: var(--lead-bg);
            border: 1.5px solid var(--lead-border);
            border-left: 5px solid #EAB308;
            box-shadow: var(--shadow-elevated);
            color: #FFFFFF;
            position: relative;
        }

        .card-tactical-left {
            background: var(--card1-bg);
            border: 1.5px solid var(--card1-border);
            box-shadow: var(--shadow-elevated);
            color: #F1F5F9;
            position: relative;
        }

        .card-tactical-right {
            background: var(--card2-bg);
            border: 1.5px solid var(--card2-border);
            box-shadow: var(--shadow-elevated);
            color: #F1F5F9;
            position: relative;
        }

        .card-corner-gold::before,
        .card-corner-gold::after {
            content: '';
            position: absolute;
            width: 11px;
            height: 11px;
            pointer-events: none;
            border-color: rgba(234, 179, 8, 0.68);
        }

        .card-corner-gold::before {
            top: 6px;
            right: 6px;
            border-top: 2px solid;
            border-right: 2px solid;
            border-top-right-radius: 3px;
        }

        .card-corner-gold::after {
            bottom: 6px;
            left: 6px;
            border-bottom: 2px solid;
            border-left: 2px solid;
            border-bottom-left-radius: 3px;
        }

        /* =====================================================================
           TEXTBOOK FIGURE THUMBNAIL (.fig-thumb) WITH OBJECT-FIT: CONTAIN ON #050912
           ===================================================================== */
        .fig-thumb {
            background-color: #050912;
            border: 1.5px solid rgba(234, 179, 8, 0.55);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fig-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #050912;
            display: block;
        }

        /* Typography Fluid Scaling */
        .slide-main-title {
            color: #FFFFFF;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
            font-size: clamp(1.22rem, 2.05vw, 1.88rem);
            line-height: 1.24;
        }

        .lead-fluid {
            font-size: clamp(0.98rem, 1.24vw, 1.15rem);
            line-height: 1.58;
        }

        .card-heading-fluid {
            font-size: clamp(1.04rem, 1.36vw, 1.28rem);
            line-height: 1.32;
        }

        .body-fluid {
            font-size: clamp(0.92rem, 1.05vw, 1.03rem);
            line-height: 1.56;
        }

        .slide-transition {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .slide-transition.fade-out {
            opacity: 0;
            transform: translateY(5px);
        }
    </style>
</head>

        /* =========================================================================
           2. MULTI-EXTENSION IMAGE LOADER FOR SUBFOLDER `anh/`
           ========================================================================= */
        const IMG_EXTENSIONS = [".jpg", ".png", ".jpeg", ".webp", ".JPG", ".PNG"];
        const resolvedImageCache = {};

        function createAutoResolveImage(fileBase, altText, onSuccessCallback, onFailCallback) {
            const img = document.createElement("img");
            img.alt = altText;

            if (resolvedImageCache[fileBase]) {
                img.src = resolvedImageCache[fileBase];
                if (typeof onSuccessCallback === "function") {
                    onSuccessCallback(img, resolvedImageCache[fileBase]);
                }
                return img;
            }

            let attempt = 0;
            img.src = "anh/" + fileBase + IMG_EXTENSIONS[attempt];

            img.onload = function () {
                const validSrc = "anh/" + fileBase + IMG_EXTENSIONS[attempt];
                resolvedImageCache[fileBase] = validSrc;
                if (typeof onSuccessCallback === "function") {
                    onSuccessCallback(img, validSrc);
                }
            };

            img.onerror = function () {
                attempt++;
                if (attempt < IMG_EXTENSIONS.length) {
                    img.src = "anh/" + fileBase + IMG_EXTENSIONS[attempt];
                } else {
                    img.onerror = null;
                    if (typeof onFailCallback === "function") {
                        onFailCallback(img);
                    }
                }
            };

            return img;
        }

            iframes.forEach(iframe => {

        function renderSlide(index, animate = true) {
            try {
                const slide = SLIDES[index];
                if (!slide) return;

                const idxStr = String(index + 1).padStart(2, "0");
                const totalStr = String(totalSlides).padStart(2, "0");

                if (animate) slideStage.classList.add("fade-out");

                setTimeout(() => {
                    try {
                        slideViewport.scrollTop = 0;

                        topProgressBar.style.width = ((index + 1) / totalSlides * 100) + "%";
                        headerSectionBadge.textContent = slide.section;
                        footerCounter.textContent = idxStr + " / " + totalStr;

                        // Clear stage safely
                        while (slideStage.firstChild) {
                            slideStage.removeChild(slideStage.firstChild);
                        }

                        // 1. Slide Header Title Block
                        const headerWrap = document.createElement("div");
                        headerWrap.className = "flex flex-col sm:flex-row sm:items-end justify-between gap-2 pb-2.5 mb-3.5 border-b border-amber-400/35";

                        btnPrev.disabled = (index === 0);
                        btnNext.disabled = (index === totalSlides - 1);

                        if (animate) slideStage.classList.remove("fade-out");
                    } catch (innerErr) {
                        console.error("Slide render inner error:", innerErr);
                    }
                }, animate ? 90 : 0);
            } catch (err) {
                console.error("Slide render error:", err);
            }
        }

        function goToSlide(targetIndex, animate = true) {
            const now = Date.now();
            if (now - lastNavTimestamp < 220) return;
            if (targetIndex < 0 || targetIndex >= totalSlides || targetIndex === currentSlide) return;

            lastNavTimestamp = now;

            if (document.activeElement && typeof document.activeElement.blur === "function") {
                document.activeElement.blur();
            }

            stopAllActiveVideos();
            currentSlide = targetIndex;
            renderSlide(currentSlide, animate);
        }

        function nextSlide() {
            goToSlide(currentSlide + 1);
        }

        function prevSlide() {
            goToSlide(currentSlide - 1);
        }

        function jumpToSlide(idx) {
            toggleIndexModal(false);
            if (idx === currentSlide) return;
            goToSlide(idx);
        }

        function toggleIndexModal(forceState) {
            const isHidden = indexModal.classList.contains("hidden");
            const shouldOpen = (typeof forceState === "boolean") ? forceState : isHidden;

            if (shouldOpen) {
                while (indexGrid.firstChild) {
                    indexGrid.removeChild(indexGrid.firstChild);
                }

                SLIDES.forEach((s, idx) => {
                    const isActive = (idx === currentSlide);
                    const btn = document.createElement("button");
                    btn.className = isActive
                        ? "text-left p-3.5 rounded-xl border transition bg-slate-900 text-white border-amber-400 ring-2 ring-amber-400/60 flex flex-col justify-between gap-1.5 cursor-pointer shadow-md"
                        : "text-left p-3.5 rounded-xl border transition bg-[#0B1322] text-slate-200 border-slate-700/80 hover:border-sky-400 flex flex-col justify-between gap-1.5 cursor-pointer shadow-md";
                    btn.addEventListener("click", function () {
                        this.blur();
                        jumpToSlide(idx);
                    });

                    const top = document.createElement("div");
                    top.className = "flex items-center justify-between w-full gap-2";

                    const numSpan = document.createElement("span");
                    numSpan.className = isActive
                        ? "text-xs font-extrabold text-amber-300 shrink-0"
                        : "text-xs font-extrabold text-sky-400 shrink-0";
                    numSpan.textContent = "TRANG " + String(idx + 1).padStart(2, "0");

                    const secSpan = document.createElement("span");
                    secSpan.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-amber-400/15 text-amber-300 border border-amber-400/30 truncate";
                    secSpan.textContent = s.section;

                    top.appendChild(numSpan);
                    top.appendChild(secSpan);

                    const titleDiv = document.createElement("div");
                    titleDiv.className = "font-bold text-xs sm:text-sm line-clamp-2 text-white";
                    titleDiv.textContent = s.title;

                    btn.appendChild(top);
                    btn.appendChild(titleDiv);
                    indexGrid.appendChild(btn);
                });

                indexModal.classList.remove("hidden");
                indexModal.classList.add("flex");
            } else {
                indexModal.classList.add("hidden");
                indexModal.classList.remove("flex");
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        // Single Unified Keyboard Listener (Prevents Double-Skip & Button Focus Replay)
        window.addEventListener("keydown", (e) => {
            if (e.repeat) return;

            const navKeys = ["ArrowRight", "ArrowLeft", " ", "PageDown", "PageUp"];
            if (navKeys.includes(e.key)) {
                if (e.key === " " && document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
                    return;
                }
                e.preventDefault();
                if (document.activeElement && typeof document.activeElement.blur === "function") {
                    document.activeElement.blur();
                }
                if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
                    nextSlide();
                } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
                    prevSlide();
                }
            } else if (e.key === "g" || e.key === "G") {
                e.preventDefault();
                toggleIndexModal();
            } else if (e.key === "f" || e.key === "F") {
                e.preventDefault();
                toggleFullScreen();
            } else if (e.key === "Escape") {
                toggleIndexModal(false);
                closeFigureZoom();
            }
        });

        /* =========================================================================
           4. 3-LAYER BATTLEFIELD CANVAS ENGINE
              - Layer 1: Drifting Battlefield Smoke Wisps
              - Layer 2: Sweeping Interceptor Jets with Afterburner & Contrails
              - Layer 3: Anti-Aircraft Tracer Streaks & High-Altitude Flak Bursts
           ========================================================================= */
        let ambientEnabled = true;
        const canvas = document.getElementById("ambientCanvas");
        const ctx = canvas.getContext("2d");
        let cw = 0, ch = 0;

        function resizeCanvas() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);

        const smokeLayers = Array.from({ length: 14 }, () => ({
            x: Math.random() * 1600,
            r: 120 + Math.random() * 170,
            vx: 0.16 + Math.random() * 0.24,
            alpha: 0.04 + Math.random() * 0.04,
            offsetY: Math.random() * 210
        }));

        const jets = [];
        function spawnJet() {
            const goRight = Math.random() > 0.35;
            const y = ch * (0.12 + Math.random() * 0.32);
            const speed = (2.6 + Math.random() * 1.4) * (goRight ? 1 : -1);
            jets.push({
                x: goRight ? -90 : cw + 90,
                y,
                vx: speed,
                vy: (Math.random() - 0.5) * 0.25,
                scale: 0.75 + Math.random() * 0.35,
                contrail: []
            });
        }

        const tracers = [];
        const flakBursts = [];

        function spawnTracerVolley() {
            const fromLeft = Math.random() > 0.5;
            const baseX = fromLeft ? cw * (0.08 + Math.random() * 0.25) : cw * (0.67 + Math.random() * 0.25);
            const count = 2 + Math.floor(Math.random() * 2);

            for (let k = 0; k < count; k++) {
                setTimeout(() => {
                    const startX = baseX + (Math.random() - 0.5) * 35;
                    const startY = ch + 10;
                    const vx = fromLeft ? (3.2 + Math.random() * 1.8) : -(3.2 + Math.random() * 1.8);
                    const vy = -(7.6 + Math.random() * 2.4);
                    tracers.push({
                        x: startX,
                        y: startY,
                        vx,
                        vy,
                        gravity: 0.028,
                        history: [],
                        maxHistory: 20,
                        isRed: Math.random() > 0.45,
                        burstY: ch * (0.14 + Math.random() * 0.24),
                        life: 1.0
                    });
                }, k * 140);
            }
        }

        let frameCount = 0;
        function animateAmbient() {
            requestAnimationFrame(animateAmbient);
            if (!ambientEnabled) return;

            ctx.clearRect(0, 0, cw, ch);
            frameCount++;

            // Layer 1: Battlefield Smoke Wisps
            smokeLayers.forEach(p => {
                p.x += p.vx;
                if (p.x - p.r > cw) p.x = -p.r;
                const py = ch - 24 - p.offsetY;
                const grad = ctx.createRadialGradient(p.x, py, 14, p.x, py, p.r);
                grad.addColorStop(0, `rgba(148, 163, 184, ${p.alpha})`);
                grad.addColorStop(1, "rgba(4, 7, 13, 0)");
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(p.x, py, p.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // Layer 2: Interceptor Jets with Afterburners & Contrails
            if (frameCount % 320 === 45 && jets.length < 2) {
                spawnJet();
            }

            for (let i = jets.length - 1; i >= 0; i--) {
                const j = jets[i];
                j.x += j.vx;
                j.y += j.vy;

                j.contrail.push({ x: j.x, y: j.y });
                if (j.contrail.length > 55) j.contrail.shift();

                if (j.contrail.length > 2) {
                    const tail = j.contrail[0];
                    const grad = ctx.createLinearGradient(tail.x, tail.y, j.x, j.y);
                    grad.addColorStop(0, "rgba(148, 163, 184, 0)");
                    grad.addColorStop(1, "rgba(186, 230, 253, 0.28)");
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 2.2 * j.scale;
                    ctx.beginPath();
                    ctx.moveTo(tail.x, tail.y);
                    for (let c = 1; c < j.contrail.length; c++) {
                        ctx.lineTo(j.contrail[c].x, j.contrail[c].y);
                    }
                    ctx.stroke();
                }

                ctx.save();
                ctx.translate(j.x, j.y);
                const dir = j.vx >= 0 ? 1 : -1;
                ctx.scale(dir * j.scale, j.scale);

                const flicker = 12 + Math.random() * 8;
                const abGrad = ctx.createLinearGradient(-14, 0, -14 - flicker, 0);
                abGrad.addColorStop(0, "rgba(254, 240, 138, 0.9)");
                abGrad.addColorStop(0.5, "rgba(249, 115, 22, 0.65)");
                abGrad.addColorStop(1, "rgba(239, 68, 68, 0)");
                ctx.fillStyle = abGrad;
                ctx.beginPath();
                ctx.moveTo(-14, -2.5);
                ctx.lineTo(-14 - flicker, 0);
                ctx.lineTo(-14, 2.5);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "rgba(148, 163, 184, 0.42)";
                ctx.strokeStyle = "rgba(226, 232, 240, 0.55)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(22, 0);
                ctx.lineTo(4, -3);
                ctx.lineTo(-8, -14);
                ctx.lineTo(-13, -14);
                ctx.lineTo(-11, -3);
                ctx.lineTo(-17, -7);
                ctx.lineTo(-19, -7);
                ctx.lineTo(-16, 0);
                ctx.lineTo(-19, 7);
                ctx.lineTo(-17, 7);
                ctx.lineTo(-11, 3);
                ctx.lineTo(-13, 14);
                ctx.lineTo(-8, 14);
                ctx.lineTo(4, 3);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                if ((dir === 1 && j.x > cw + 140) || (dir === -1 && j.x < -140)) {
                    jets.splice(i, 1);
                }
            }

            // Layer 3: Anti-Aircraft Tracers & High-Altitude Flak Bursts
            if (frameCount % 175 === 25 && tracers.length < 4) {
                spawnTracerVolley();
            }

            for (let i = tracers.length - 1; i >= 0; i--) {
                const t = tracers[i];
                t.x += t.vx;
                t.y += t.vy;
                t.vy += t.gravity;
                t.life -= 0.008;

                t.history.push({ x: t.x, y: t.y });
                if (t.history.length > t.maxHistory) t.history.shift();

                if (t.history.length > 1) {
                    const tail = t.history[0];
                    const head = t.history[t.history.length - 1];
                    const grad = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
                    const coreColor = t.isRed
                        ? `rgba(248, 113, 113, ${Math.max(0, t.life * 0.85)})`
                        : `rgba(250, 204, 21, ${Math.max(0, t.life * 0.9)})`;
                    grad.addColorStop(0, "rgba(0, 0, 0, 0)");
                    grad.addColorStop(1, coreColor);

                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 2.2;
                    ctx.lineCap = "round";
                    ctx.beginPath();
                    ctx.moveTo(tail.x, tail.y);
                    for (let j = 1; j < t.history.length; j++) {
                        ctx.lineTo(t.history[j].x, t.history[j].y);
                    }
                    ctx.stroke();

                    ctx.fillStyle = `rgba(254, 249, 195, ${Math.max(0, t.life)})`;
                    ctx.beginPath();
                    ctx.arc(head.x, head.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (t.y <= t.burstY || t.life <= 0) {
                    if (t.y <= t.burstY) {
                        flakBursts.push({
                            x: t.x,
                            y: t.y,
                            r: 4,
                            maxR: 26 + Math.random() * 14,
                            alpha: 0.75
                        });
                    }
                    tracers.splice(i, 1);
                }
            }

            for (let i = flakBursts.length - 1; i >= 0; i--) {
                const f = flakBursts[i];
                f.r += 1.4;
                f.alpha -= 0.032;

                if (f.alpha > 0) {
                    const burstGrad = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, f.r);
                    burstGrad.addColorStop(0, `rgba(254, 240, 138, ${f.alpha})`);
                    burstGrad.addColorStop(0.5, `rgba(249, 115, 22, ${f.alpha * 0.55})`);
                    burstGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
                    ctx.fillStyle = burstGrad;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    flakBursts.splice(i, 1);
                }
            }
        }

        function toggleAmbientFx() {
            ambientEnabled = !ambientEnabled;
            const dot = document.getElementById("fxDot");
            if (ambientEnabled) {
                dot.classList.remove("bg-slate-500");
                dot.classList.add("bg-emerald-400");
            } else {
                dot.classList.remove("bg-emerald-400");
                dot.classList.add("bg-slate-500");
                ctx.clearRect(0, 0, cw, ch);
            }
        }

        // Safe Initial Render on DOMContentLoaded
        function initPresentation() {
            try {
                resizeCanvas();
                renderSlide(0, false);
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initPresentation);
        } else {
            initPresentation();
        }

        // Start Ambient Battlefield Loop on Window Load
        window.onload = function () {
            resizeCanvas();
            spawnJet();
            spawnTracerVolley();
            animateAmbient();
        };
    </script>
</body>
</html>
